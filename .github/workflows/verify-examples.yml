name: Verify executable examples

on:
  pull_request:
    paths:
      - "examples/**"
      - "manuscript/**"
      - ".github/workflows/verify-examples.yml"
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "manuscript/**"
      - ".github/workflows/verify-examples.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/requirements-lock.txt
      - run: python -m pip install -r examples/requirements-lock.txt
      - run: python manuscript/tools/audit_code_blocks.py
      - run: python manuscript/tools/verify_code_examples.py
      - run: python examples/run_all.py
